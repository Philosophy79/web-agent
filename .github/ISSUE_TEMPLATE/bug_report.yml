name: Bug 报告
description: 提交一个 bug 报告，帮助我们改进
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢报告问题！请尽可能提供详细信息，便于我们复现。
  - type: input
    id: os
    attributes:
      label: 操作系统
      placeholder: 例如 Windows 11 23H2 / macOS 14 / Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: 环境版本
      description: Node、Python、ffmpeg 版本（`node --version`、`python --version`）
      placeholder: Node v24.1.0 / Python 3.14.1
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: 复现命令
      description: 请贴出完整命令（**注意脱敏**，不要包含密码、Cookie、个人链接）
      placeholder: node agent.mjs video "<url>" --model small
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      placeholder: 应该输出转录文字稿……
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 完整报错信息（可截取关键部分）
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: 补充信息
      description: 网络环境（是否代理）、复现概率、日志片段等
