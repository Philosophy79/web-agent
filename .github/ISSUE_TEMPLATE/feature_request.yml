name: 功能建议
description: 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提出任何想法！描述得越具体，越容易被采纳。
  - type: textarea
    id: problem
    attributes:
      label: 这个功能解决什么问题
      description: 描述你遇到的使用场景或痛点
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案
      description: 你希望怎么实现？可以是命令示例、交互流程描述
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 是否用现有命令组合尝试过？效果如何？
  - type: textarea
    id: more
    attributes:
      label: 补充信息
      description: 相关链接、参考项目等
